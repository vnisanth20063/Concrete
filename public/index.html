<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="CONCRETE is a premium construction company in Chennai building luxury villas, residences, commercial spaces and interiors." />
  <meta name="theme-color" content="#f5f0e8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="app.css" />
  <script>
    try { var t = localStorage.getItem('concrete-theme'); if (t) document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('concrete-lang'); if (l) document.documentElement.setAttribute('lang', l); } catch (e) {}

</head>

  <div id="root"></div>

</html>
